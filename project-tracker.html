function ymdToDay(y,mo,d){ if(y<2000||y>2100) return {ok:false}; const dt=new Date(Date.UTC(y,mo-1,d)); if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d) return {ok:false}; return {ok:true,day:Math.floor(dt.getTime()/DAY_MS)}; }
function parseImportDate(v){
  if(v===null||v===undefined||v==='') return { ok:true, day:null };
  if(typeof v==='number' || /^\d+(\.\d+)?$/.test(String(v).trim())){ const n=Number(v); return (n>=20000&&n<=80000)? { ok:true, day:Math.floor(n)-25569 } : { ok:false }; }   // Excel stores dates as day numbers
  const t=String(v).trim(); let m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t))) return ymdToDay(+m[1],+m[2],+m[3]);
  if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(t))){ let y=+m[3]; if(y<100) y+=2000; return ymdToDay(y,+m[1],+m[2]); }
  const ms=Date.parse(t); if(!isNaN(ms)){ const d=new Date(ms); return ymdToDay(d.getFullYear(),d.getMonth()+1,d.getDate()); }
  return { ok:false };
}
function resolveStaff(token){
  const t=token.trim().replace(/\s+/g,' '), low=t.toLowerCase(); if(!t) return {};
  if(ALL_ALIASES.includes(low)) return { name:ALL_STAFF };
  const exact=STAFF.find(n=>n.toLowerCase()===low); if(exact) return { name:exact };
  const hits=STAFF.filter(n=>{ const full=n.toLowerCase(), parts=full.split(/[\s-]+/); return full.startsWith(low) || low.split(' ').every(w=>parts.some(x=>x.startsWith(w))); });
  if(hits.length===1) return { name:hits[0] };
  return { error: hits.length>1? 'matches more than one person' : 'is not in the staff list' };
}
function mapHeaders(row){ const out={}; (row||[]).forEach((h,i)=>{ const k=HEADER_LOOKUP[normHeader(h)]; if(k && out[k]===undefined) out[k]=i; }); return out; }
function isYes(v){ return /^(yes|y|true|1|x|✓|✔|milestone)$/i.test(String(v==null?'':v).trim()); }

function buildPlan(rows){
  let hi=-1, cols={};
  for(let i=0;i<Math.min(rows.length,15);i++){ const m=mapHeaders(rows[i]); if(m.task!==undefined || m.subtask!==undefined){ hi=i; cols=m; break; } }
  if(hi<0) return { error:'The header row was not found. The first row of the file needs column titles, including “Task”. Download the template to see the layout.' };
  const warnings=[], W=(rn,msg)=>warnings.push('Row '+rn+': '+msg);
  const get=(row,k)=>{ const i=cols[k]; if(i===undefined) return ''; const v=row[i]; return v==null? '' : (typeof v==='string'? v.trim() : v); };
  const gs=(row,k)=>String(get(row,k)).trim();

  // Excel stores 50% as 0.5; if every value in the column is between 0 and 1, treat them as fractions
  const pctVals=[]; for(let i=hi+1;i<rows.length;i++){ const raw=get(rows[i]||[],'percent'); if(raw!=='' && !/%/.test(String(raw))){ const n=Number(raw); if(!isNaN(n)) pctVals.push(n); } }
  const pctFraction=pctVals.length>0 && pctVals.every(n=>n>=0&&n<=1);

  const phases=[], byName={}; let cur=null, lastTask=null; const pending=[], idMap={}, nameMap={};
  const phaseFor=name=>{ const k=name.toLowerCase(); if(!byName[k]){ const ph=newPhase(name); byName[k]=ph; phases.push(ph); } return byName[k]; };

  for(let i=hi+1;i<rows.length;i++){
    const row=rows[i]||[], rn=i+1;
    if(row.every(c=>c===''||c==null)) continue;
    const phaseName=gs(row,'phase'), taskName=gs(row,'task'), subName=gs(row,'subtask');
    if(phaseName) cur=phaseFor(phaseName);
    if(!taskName && !subName){
      const other=Object.keys(cols).some(k=>k!=='phase' && gs(row,k)!=='');
      if(other) W(rn,'there is no task name, so the row was skipped');
      continue;
    }
    if(!cur) cur=phaseFor('Imported tasks');
    let t;
    if(subName){
      const parentName=taskName||(lastTask? lastTask.name : '');
      if(!parentName){ W(rn,'a subtask needs a task above it, so the row was skipped'); continue; }
      let parent=cur.tasks.find(x=>x.name.toLowerCase()===parentName.toLowerCase());
      if(!parent){ parent=newTask({ name:parentName }); cur.tasks.push(parent); }
      t=newTask({ name:subName }); parent.subtasks.push(t); lastTask=parent;
    } else { t=newTask({ name:taskName }); cur.tasks.push(t); lastTask=t; }

    // people
    const names=[]; gs(row,'assignees').split(/[;,|\n]|\s+(?:and|&)\s+/i).map(x=>x.trim()).filter(Boolean).forEach(tok=>{
      const r=resolveStaff(tok); if(r.name) names.push(r.name); else W(rn,'“'+tok+'” '+r.error+', so it was left out');
    });
    t.assignees=normAssignees(names);

    // dates
    const sd=parseImportDate(get(row,'start')), ed=parseImportDate(get(row,'end'));
    if(!sd.ok){ W(rn,'the start date “'+get(row,'start')+'” could not be read'); sd.day=null; }
    if(!ed.ok){ W(rn,'the end date “'+get(row,'end')+'” could not be read'); ed.day=null; }
    let s=sd.day, e=ed.day; const days=Math.round(Number(get(row,'days'))||0);
    if(s==null && e!=null) s=e;
    if(e==null && s!=null) e = days>1? s+days-1 : s;
    if(s!=null && e<s){ W(rn,'the end date is before the start date, so the end was set to the start'); e=s; }
    const ms=isYes(get(row,'milestone')); if(ms){ t.milestone=true; if(s!=null) e=s; }
    t.start = s==null? '' : fmtDay(s); t.end = e==null? '' : fmtDay(e);

    // numbers, status, notes, checklist
    const hours=get(row,'hours'); if(hours!==''){ const n=Number(hours); if(isNaN(n)) W(rn,'the hours “'+hours+'” are not a number'); else t.estHours=Math.max(0,n); }
    const act=get(row,'actual'); if(act!==''){ const n=Number(act); if(!isNaN(n)) t.actualHours=Math.max(0,n); }
    const pr=get(row,'percent');
    if(pr!==''){ let n=parseFloat(String(pr).replace('%','')); if(isNaN(n)) W(rn,'the percent complete “'+pr+'” is not a number'); else { if(pctFraction && !/%/.test(String(pr))) n*=100; setLeafPercent(t,clamp(n,0,100)); } }
    const st=gs(row,'status'); if(st){ const mapped=STATUS_WORDS[st.toLowerCase().replace(/[^a-z]/g,'')]; if(mapped) setLeafStatus(t,mapped); else W(rn,'the status “'+st+'” was not recognized'); }
    t.notes=gs(row,'notes');
    gs(row,'checklist').split(/\||\n/).map(x=>x.trim()).filter(Boolean).forEach(x=>t.checklist.push({ id:uid('c'), text:x, done:false }));
    if(t.checklist.length) syncStatusFromChecklist(t);

    // identifiers for dependencies
    const id=gs(row,'id'); if(id) idMap[id.toLowerCase()]=t;
    if(!subName || true) { const k=t.name.toLowerCase(); if(!nameMap[k]) nameMap[k]=t; }
    const dep=gs(row,'depends'); if(dep) pending.push({ t, rn, tokens:dep.split(/[;,|\n]/).map(x=>x.trim()).filter(Boolean) });
  }

  // dependencies (finish-to-start, on tasks that are not groups)
  const staged={ phases };
  pending.forEach(({t,rn,tokens})=>{
    tokens.forEach(tok=>{
      const target=idMap[tok.toLowerCase()]||nameMap[tok.toLowerCase()];
      if(!target){ W(rn,'“'+tok+'” in Depends on does not match any ID or task name'); return; }
      if(target===t){ W(rn,'a task cannot depend on itself'); return; }
      if(isParent(target) || isParent(t)){ W(rn,'“'+tok+'” has subtasks, so depend on one of its subtasks instead'); return; }
      if(wouldCycle(staged,t.id,target.id)){ W(rn,'depending on “'+tok+'” would create a loop, so it was skipped'); return; }
      if(!t.deps.includes(target.id)) t.deps.push(target.id);
    });
  });

  const all=phases.flatMap(ph=>ph.tasks.flatMap(leavesOfTask));
  if(!all.length) return { error:'No tasks were found under the “Task” column. Check that the file has task names and try again.' };
  const noDates=all.filter(l=>!l.start).length;
  if(noDates) warnings.push(noDates+' of '+all.length+' tasks have no dates. They will be added, but will not appear on the Gantt chart until dates are entered.');
  return { phases, warnings, stats:{
    phases:phases.length, tasks:phases.reduce((n,ph)=>n+ph.tasks.length,0),
    subtasks:phases.reduce((n,ph)=>n+ph.tasks.reduce((m,t)=>m+t.subtasks.length,0),0),
    milestones:all.filter(l=>l.milestone).length, deps:all.reduce((n,l)=>n+l.deps.length,0) } };
}

function applyImport(pid,plan,mode){
  const prev=state.autoAdjust; state.autoAdjust=false;          // keep the dates exactly as they are in the file
  try{
    mutate(pid,p=>{
      if(mode==='replace') p.phases=plan.phases;
      else plan.phases.forEach(ph=>{ const ex=p.phases.find(x=>x.name.toLowerCase()===ph.name.toLowerCase()); if(ex) ex.tasks.push(...ph.tasks); else p.phases.push(ph); });
    });
  } finally { state.autoAdjust=prev; }
}
async function handleImportFile(file){
  const m=state.modal; if(!m||m.type!=='import'||!file) return;
  m.error='';
  try{
    const plan=buildPlan(await readImportFile(file));
    if(plan.error) m.error=plan.error; else { m.plan=plan; m.step='preview'; m.fileName=file.name; }
  }catch(e){ m.error=e.message||'That file could not be read.'; }
  queueRender();
}
function importModalHtml(m){
  const p=getProject(m.pid); const title=p? esc(p.title) : 'this project';
  if(m.step==='preview' && m.plan){
    const st=m.plan.stats, plural=(n,w)=>n+' '+w+(n===1?'':'s'), existing=p? projectLeaves(p).length : 0;
    let rows='', shown=0;
    m.plan.phases.forEach(ph=>{
      if(shown<60) rows+='<tr class="ph"><td colspan="4">'+esc(ph.name)+'</td></tr>';
      ph.tasks.forEach(t=>{
        const line=(x,sub)=>{ if(shown++>=60) return ''; const rg=isParent(x)? taskRange(x) : { s:parseDay(x.start), e:parseDay(x.end) }; const lab=assigneeLabel(x);
          return '<tr><td style="padding-left:'+(sub?30:14)+'px">'+(x.milestone?'<span style="color:var(--gold)">◆ </span>':'')+esc(x.name)+'</td><td>'+(isParent(x)?'':esc(lab.empty?'':lab.text))+'</td><td>'+(rg.s!=null? fmtLocal(rg.s)+(rg.e!==rg.s? ' – '+fmtLocal(rg.e):'') : '<span class="muted">no dates</span>')+'</td><td class="muted">'+(x.deps.length? x.deps.length+' predecessor'+(x.deps.length===1?'':'s') : '')+'</td></tr>'; };
        rows+=line(t,false); t.subtasks.forEach(sb=>{ rows+=line(sb,true); });
      });
    });
    const total=st.tasks+st.subtasks;
    return '<div class="m-back"><div class="m-box" style="max-width:760px"><h3>Import preview</h3>'+
      '<p style="margin:0 0 8px"><b>'+plural(st.phases,'phase')+' · '+plural(st.tasks,'task')+' · '+plural(st.subtasks,'subtask')+' · '+plural(st.milestones,'milestone')+' · '+plural(st.deps,'dependency').replace('dependencys','dependencies')+'</b><br><span class="muted">from '+esc(m.fileName||'the file')+'</span></p>'+
      (m.plan.warnings.length? '<div class="imp-warn"><b>'+plural(m.plan.warnings.length,'thing')+' to check.</b> These will not stop the import; each one tells you what was left out or changed.<ul>'+m.plan.warnings.slice(0,40).map(w=>'<li>'+esc(w)+'</li>').join('')+(m.plan.warnings.length>40?'<li>…and '+(m.plan.warnings.length-40)+' more.</li>':'')+'</ul></div>' : '<div class="imp-ok">Everything in the file was read cleanly.</div>')+
      '<div class="imp-prev"><table class="imp-table"><thead><tr><th>Task</th><th>Assignees</th><th>Dates</th><th></th></tr></thead><tbody>'+rows+(total>60?'<tr><td colspan="4" class="muted" style="padding-left:14px">…and '+(total-60)+' more not shown here</td></tr>':'')+'</tbody></table></div>'+
      '<div class="dw-f" style="margin-top:12px"><label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:.9em;color:var(--charcoal);font-weight:600"><input type="radio" name="importMode" value="add" style="width:auto"'+(m.mode!=='replace'?' checked':'')+'> Add to “'+title+'”'+(existing?' (keeps its '+plural(existing,'existing task')+')':'')+'</label>'+
      '<label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:.9em;color:var(--charcoal);font-weight:600;margin-top:6px"><input type="radio" name="importMode" value="replace" style="width:auto"'+(m.mode==='replace'?' checked':'')+'> Replace the current plan'+(existing?' (removes its '+plural(existing,'task')+'; Undo brings them back)':'')+'</label></div>'+
      '<div class="m-foot"><button class="btn" data-act="import-back">Choose another file</button><button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" data-act="import-go">Import</button></div></div></div>';
  }
  return '<div class="m-back"><div class="m-box"><h3>Import tasks from a file</h3>'+
    '<p>Choose a CSV or Excel (.xlsx) file to add phases and tasks to <b>'+title+'</b>. You will see a preview before anything is added, and Undo reverses the whole import.</p>'+
    '<p class="muted" style="font-size:.9em">Not sure how to lay it out? Start from a template: <button class="linkbtn" data-act="template-xlsx">Excel template</button> or <button class="linkbtn" data-act="template-csv">CSV template</button>. Only a <b>Task</b> column is required.</p>'+
    '<div class="dw-f"><label>Choose a file</label><input type="file" id="importFile" accept=".csv,.xlsx,.xlsm,.txt,.tsv"></div>'+
    (m.error? '<p class="imp-err" role="alert">'+esc(m.error)+'</p>' : '')+
    '<div class="m-foot"><button class="btn" data-act="modal-close">Cancel</button></div></div></div>';
}

async function boot(){
  captureToken();
  const from=new URLSearchParams(location.search).get('from');
  if(from){ try{ sessionStorage.setItem(PREFILL_KEY,from); }catch(e){} history.replaceState(null,'',location.pathname+location.hash); }
  handleRoute();
  if(!rawGet(TOKEN_KEY)){ state.signIn='Sign in to view and manage projects.'; render(); return; }
  render();
  try{ const me=await api('/me'); state.user={ email:me.email, name:me.name, canEdit:!!me.isAdmin }; }
  catch(e){ if(!e.silent){ state.authError=e; render(); } return; }
  try{ await loadProjects(); }
  catch(e){ if(!e.silent){ state.authError=e; render(); } return; }
  state.loaded=true;
  let pf=null; try{ pf=sessionStorage.getItem(PREFILL_KEY); sessionStorage.removeItem(PREFILL_KEY); }catch(e){}
  state.prefillRaw = pf? decodePrefill(pf) : null;
  if(state.prefillRaw) handlePrefill();
  render();
  setInterval(poll,45000);
}
window.addEventListener('DOMContentLoaded',boot);
</script>
